<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="节奏">
<meta name="description" content="90 天生活重启：钉住一天七个时间点，想刷手机时有个抓手。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>节奏 · 90 天生活重启</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#F6F4EF;color:#1E2B26;font:15px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid #E8E3D8;border-radius:16px;padding:16px;margin-bottom:12px}
.card.tight{padding:14px 16px}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:12px;color:#7D8A83;letter-spacing:.04em}
.heroTitle{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin-top:2px}
.of{font-size:15px;font-weight:400;color:#96A19A}
.heroTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{width:56px;height:56px;flex:0 0 56px}
.ring circle{fill:none;stroke-width:4.5}
.ring .bg{stroke:#EDE9E0}
.ring .fg{stroke:#1D6F5C;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s}
.bar{height:6px;border-radius:99px;background:#EDE9E0;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:#1D6F5C;border-radius:99px;transition:width .4s}
.hint{font-size:12.5px;color:#7D8A83;margin-top:9px}
.sec{font-size:12.5px;color:#7D8A83;margin:18px 2px 8px;letter-spacing:.04em}
.now{padding:16px;border-radius:16px;background:#1D6F5C;color:#fff;margin-bottom:12px}
.now .t{font-size:12.5px;opacity:.78}
.now .h{font-size:19px;font-weight:600;margin-top:4px;line-height:1.35}
.now .s{font-size:12.5px;opacity:.8;margin-top:5px}
.now .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
.now button{border:0;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:600;background:#fff;color:#1D6F5C}
.now button.done{background:rgba(255,255,255,.2);color:#fff}
.anchor{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid #F1EDE5}
.anchor:last-child{border-bottom:0}
.anchor .tm{flex:0 0 46px;font-size:13px;font-weight:600;color:#3D4A44;padding-top:2px;font-variant-numeric:tabular-nums}
.anchor .tx{flex:1;min-width:0}
.anchor .ti{font-size:15px;font-weight:500}
.anchor .sb{font-size:12px;color:#8A968F;margin-top:2px}
.ck{flex:0 0 26px;height:26px;width:26px;border-radius:50%;border:1.5px solid #D5D0C6;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ck svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:#1D6F5C;border-color:#1D6F5C}
.ck.on svg{opacity:1}
.anchor.on .ti{color:#7D8A83;text-decoration:line-through;text-decoration-color:#C9C3B7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:#FBFAF6;border:1px solid #E8E3D8;border-radius:12px;padding:10px 12px}
.field label{display:block;font-size:11.5px;color:#7D8A83;margin-bottom:2px}
.field input{border:0;background:none;font:inherit;font-size:17px;font-weight:600;color:#1E2B26;width:100%;padding:0;outline:none;font-variant-numeric:tabular-nums}
.mood{margin-top:6px}
.mood .lbl{display:flex;justify-content:space-between;font-size:13px;margin:12px 0 6px}
.mood .lbl span:last-child{color:#7D8A83;font-size:12px}
input[type=range]{width:100%;-webkit-appearance:none;height:26px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:#EDE9E0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#1D6F5C;margin-top:-8px;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{display:block;width:100%;padding:15px;border-radius:13px;border:0;background:#1D6F5C;color:#fff;font-size:16px;font-weight:600;font-family:inherit}
.btn.ghost{background:#fff;color:#1D6F5C;border:1px solid #CFDDD7}
.btn.amber{background:#B8792A}
.btn.sm{padding:11px;font-size:14px;border-radius:11px}
.btn:active{transform:scale(.985)}
.breath{text-align:center;padding:8px 0 2px}
.breath .phase{font-size:15px;color:#7D8A83;letter-spacing:.08em}
.breath .num{font-size:52px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:#1D6F5C}
.breath .cyc{font-size:12px;color:#96A19A;margin-top:2px}
.breathRing{width:150px;height:150px;margin:6px auto 2px;display:block}
.breathRing circle{fill:none;stroke-width:7;stroke-linecap:round}
.breathRing .bg{stroke:#EDE9E0}
.breathRing .fg{stroke:#1D6F5C;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.q{font-size:14.5px;padding:11px 0;border-bottom:1px dashed #EDE9E0;color:#3D4A44}
.q:last-child{border-bottom:0}
.q b{color:#1D6F5C;font-weight:600}
.alt{background:#FAEFDD;border:1px solid #F0DFC2;border-radius:14px;padding:16px;text-align:center}
.alt .ti{font-size:17px;font-weight:600;color:#7A5218;line-height:1.45}
.alt .sb{font-size:12.5px;color:#9A7A46;margin-top:6px}
.rows{display:flex;gap:6px;align-items:flex-end;height:76px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.col .pair{display:flex;gap:2px;align-items:flex-end;height:56px}
.col i{display:block;width:7px;border-radius:3px 3px 0 0;background:#1D6F5C;min-height:2px}
.col i.b{background:#B8792A;opacity:.7}
.col .d{font-size:10.5px;color:#96A19A}
.legend{display:flex;gap:14px;font-size:11.5px;color:#7D8A83;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:#1D6F5C;vertical-align:middle}
.legend span.b::before{background:#B8792A;opacity:.7}
.stage{padding:12px 0;border-bottom:1px solid #F1EDE5}
.stage:last-child{border-bottom:0}
.stage .hd{display:flex;justify-content:space-between;align-items:baseline}
.stage .nm{font-size:15px;font-weight:600}
.stage .wk{font-size:11.5px;color:#96A19A}
.stage .ds{font-size:12.5px;color:#7D8A83;margin-top:3px}
.stage.cur .nm{color:#1D6F5C}
.stage.done{opacity:.55}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #E8E3D8;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabwrap{display:flex;max-width:520px;margin:0 auto}
.tabwrap button{flex:1;border:0;background:none;padding:9px 0 10px;color:#9AA59E;font-size:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabwrap button.on{color:#1D6F5C}
.tabwrap svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:12px;color:#8A968F;line-height:1.7}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EDE5;font-size:14px}
.kv:last-child{border-bottom:0}
.kv em{font-style:normal;color:#7D8A83;font-size:13px}
textarea{width:100%;height:150px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid #E8E3D8;border-radius:10px;padding:10px;background:#FBFAF6;color:#3D4A44;resize:vertical}
.step{display:flex;gap:10px;font-size:13.5px;padding:8px 0;color:#3D4A44}
.step .n{flex:0 0 20px;height:20px;border-radius:50%;background:#E4F0EB;color:#1D6F5C;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar"><div class="tabwrap" id="tabs"></div></nav>
<script>
(function(){
"use strict";

var KEY = "jiezou.v1";
var ANCHORS = [
  {id:"light",     t:"06:50", ti:"起床先见光",              sb:"阳台或楼下站 10 分钟，先别摸手机"},
  {id:"breakfast", t:"08:00", ti:"早餐吃够蛋白质",          sb:"蛋、奶、豆浆 25g 以上，配热食"},
  {id:"move",      t:"10:30", ti:"起身 2 分钟 ＋ 远眺",      sb:"每 40 分钟一次，眼睛和腰都靠这一下"},
  {id:"lunch",     t:"12:40", ti:"饭后走 10 分钟，午睡≤20 分钟", sb:"下午的虚汗和犯困，在这里定下来"},
  {id:"family",    t:"18:40", ti:"陪儿子 15 分钟",          sb:"散步、拼装、读一本书，不做课程表"},
  {id:"phone",     t:"21:30", ti:"手机进客厅充电",           sb:"换成纸质书或泡脚 15 分钟"},
  {id:"sleep",     t:"22:40", ti:"熄灯",                    sb:"这一条守住，上面几条会自己好起来"}
];
var MOODS = [
  {id:"sweat", nm:"虚汗"},
  {id:"cold",  nm:"怕冷"},
  {id:"eye",   nm:"眼疲劳"},
  {id:"anx",   nm:"焦虑"}
];
var ALTS = [
  ["去楼下走一圈", "十分钟，不带手机"],
  ["泡脚 15 分钟", "40℃ 水，坐着就好"],
  ["拉伸肩颈 5 分钟", "头慢慢绕两圈，别甩"],
  ["喝一杯温水", "不是冰的，也不是奶茶"],
  ["把明天的衣服摆好", "今晚少一个决定"],
  ["给儿子讲一个故事", "他记很久，你也放松"],
  ["站桩 5 分钟", "脚与肩同宽，什么都不想"],
  ["洗个热水澡", "水别太烫，出来就困"],
  ["翻纸质书 10 页", "看不进也没关系"],
  ["整理桌面 5 分钟", "手忙起来，脑子就安静"],
  ["给老婆捶背两分钟", "比刷视频划算"],
  ["写三行今天的事", "写完就合上"]
];

var S = {start:null, days:{}};
var tabsDef = ["today","break","body","plan"];
var h = (location.hash||"").replace("#","");
var tab = tabsDef.indexOf(h) >= 0 ? h : "today";
var br = {on:false, step:0, left:0, cycle:0, timer:null, total:4};
var eye = {on:false, left:20, timer:null};

function pad(n){ return n<10 ? "0"+n : ""+n; }
function dkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); if(o && typeof o==="object"){ S.start = o.start||null; S.days = o.days||{}; } } }catch(e){}
  if(!S.start) S.start = dkey(new Date());
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function todayKey(){ return dkey(new Date()); }
function day(){ if(!S.days[todayKey()]) S.days[todayKey()] = {a:{}, sleep:"", steps:"", m:{}, urge:0}; return S.days[todayKey()]; }
function dayIndex(){
  var a = Date.parse(S.start+"T00:00:00"), b = Date.parse(todayKey()+"T00:00:00");
  if(isNaN(a)) return 1;
  return Math.max(1, Math.round((b-a)/86400000)+1);
}
function stageOf(n){
  if(n<=14) return 1;
  if(n<=42) return 2;
  return 3;
}
function streak(){
  var n = 0, d = new Date();
  for(var i=0;i<400;i++){
    var k = dkey(d), rec = S.days[k];
    var cnt = 0;
    if(rec && rec.a){ for(var j=0;j<ANCHORS.length;j++){ if(rec.a[ANCHORS[j].id]) cnt++; } }
    if(cnt>=3 || (rec && rec.sleep && rec.steps)) n++;
    else if(i>0) break;
    else if(i===0 && cnt<3){ /* 今天还没做完，不影响连续天数 */ }
    d.setDate(d.getDate()-1);
  }
  return n;
}
function mins(t){ var p=t.split(":"); return (+p[0])*60+(+p[1]); }
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function nextAnchor(){
  var m = nowMin();
  for(var i=0;i<ANCHORS.length;i++){ if(mins(ANCHORS[i].t) >= m-45) return {a:ANCHORS[i], today:true}; }
  return {a:ANCHORS[0], today:false};
}
function fmtDate(){
  var d=new Date(), w=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return (d.getMonth()+1)+" 月 "+d.getDate()+" 日 · "+w;
}
function doneCount(rec){
  var c=0; for(var i=0;i<ANCHORS.length;i++){ if(rec && rec.a && rec.a[ANCHORS[i].id]) c++; } return c;
}

function viewToday(){
  var rec = day(), n = dayIndex(), dc = doneCount(rec), nx = nextAnchor();
  var C = 2*Math.PI*18, off = C - C*Math.min(1, dc/ANCHORS.length);
  var html = "";
  html += '<section class="card hero"><div class="heroTop"><div>'+
    '<p class="eyebrow">'+fmtDate()+'</p>'+
    '<h1 class="heroTitle">第 '+n+' 天 <span class="of">/ 90</span></h1>'+
    '<p class="hint" style="margin-top:4px">连续 '+streak()+' 天 · 今天完成 '+dc+'/'+ANCHORS.length+'</p>'+
    '</div>'+
    '<svg class="ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"></circle>'+
    '<circle class="fg" cx="22" cy="22" r="18" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle></svg>'+
    '</div><div class="bar"><i style="width:'+Math.min(100,(n-1)/90*100).toFixed(1)+'%"></i></div></section>';

  var isDone = rec.a && rec.a[nx.a.id];
  html += '<div class="now"><p class="t">'+(nx.today? "接下来这件事" : "今天都过去了，先睡；明天第一件事")+'</p>'+
    '<p class="h">'+nx.a.t+'　'+nx.a.ti+'</p><p class="s">'+nx.a.sb+'</p>'+
    '<div class="row"><span style="font-size:12px;opacity:.72">'+(nx.today? "已经过点也没关系，现在补上算数":"明早见")+'</span>'+
    '<button data-act="toggle" data-id="'+nx.a.id+'" class="'+(isDone?"done":"")+'">'+(isDone? "已完成":"标记完成")+'</button></div></div>';

  html += '<p class="sec">今天的七个时间点</p><section class="card tight">';
  for(var i=0;i<ANCHORS.length;i++){
    var a = ANCHORS[i], on = !!(rec.a && rec.a[a.id]);
    html += '<div class="anchor'+(on?" on":"")+'"><div class="tm">'+a.t+'</div><div class="tx"><div class="ti">'+a.ti+'</div><div class="sb">'+a.sb+'</div></div>'+
      '<div class="ck'+(on?" on":"")+'" data-act="toggle" data-id="'+a.id+'"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div></div>';
  }
  html += '</section>';

  html += '<p class="sec">只记两个数字</p><section class="card tight"><div class="grid2">'+
    '<div class="field"><label>昨晚入睡</label><input type="time" value="'+(rec.sleep||"")+'" data-act="sleep"></div>'+
    '<div class="field"><label>今天步数</label><input type="number" inputmode="numeric" placeholder="6000" value="'+(rec.steps||"")+'" data-act="steps"></div>'+
    '</div><p class="hint">入睡时间比步数重要。先让这一格好看，别的都会跟着来。</p></section>';

  html += '<p class="sec">身体自评（1 轻 · 5 重）</p><section class="card tight"><div class="mood">';
  for(var k=0;k<MOODS.length;k++){
    var m = MOODS[k], v = (rec.m && rec.m[m.id]) || 3;
    html += '<div class="lbl"><span>'+m.nm+'</span><span class="mv" id="mv-'+m.id+'">'+v+'</span></div>'+
      '<input type="range" min="1" max="5" step="1" value="'+v+'" data-act="mood" data-id="'+m.id+'">';
  }
  html += '</div></section>';
  return html;
}

function viewBreak(){
  var rec = day();
  var html = "";
  html += '<section class="card"><p class="eyebrow">断点工具</p><h1 class="heroTitle" style="font-size:21px">手已经在点开了？</h1>'+
    '<p class="hint">不用对抗，只要往后拖 90 秒。90 秒之后那股劲就过了一半。</p>'+
    '<div style="margin-top:14px"><button class="btn amber" data-act="urge">我承认，我现在想刷</button></div>'+
    '<p class="hint" style="text-align:center">今天记录过 '+(rec.urge||0)+' 次</p></section>';

  html += '<p class="sec">先问自己三句话</p><section class="card tight">'+
    '<div class="q"><b>1</b>　我是累，还是无聊？（累就该躺，不是该刷）</div>'+
    '<div class="q"><b>2</b>　这 20 分钟之后，我会更松还是更空？</div>'+
    '<div class="q"><b>3</b>　现在放下去睡觉，明天早上我会后悔吗？</div></section>';

  var C = 2*Math.PI*62;
  var phaseName = br.on ? ["吸气","屏息","呼气"][br.step] : "准备好了就开始";
  var numTxt = br.on ? br.left : "60";
  var frac = br.on ? br.left / [4,7,8][br.step] : 1;
  html += '<p class="sec">呼吸 4-7-8（4 轮约 76 秒）</p><section class="card"><div class="breath">'+
    '<svg class="breathRing" viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="62"></circle>'+
    '<circle class="fg" cx="75" cy="75" r="62" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C-C*frac).toFixed(1)+'"></circle></svg>'+
    '<p class="phase">'+phaseName+'</p><p class="num">'+numTxt+'</p>'+
    '<p class="cyc">第 '+(br.on? Math.min(br.cycle+1,br.total) : 0)+' / '+br.total+' 轮</p></div>'+
    '<div style="margin-top:12px"><button class="btn '+(br.on?"ghost":"")+'" data-act="breath">'+(br.on? "停下":"开始呼吸")+'</button></div></section>';

  var alt = ALTS[(rec.urge||0) % ALTS.length];
  html += '<p class="sec">把手占住：换一件事做</p><div class="alt"><p class="ti">'+alt[0]+'</p><p class="sb">'+alt[1]+'</p>'+
    '<div style="margin-top:12px"><button class="btn sm ghost" data-act="alt">换一张</button></div></div>';

  html += '<p class="sec">眼睛放松 20 秒</p><section class="card tight"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px">'+
    '<div><p style="font-size:15px;font-weight:500">20-20-20</p><p class="hint" style="margin-top:2px">看 6 米外的远处 20 秒</p></div>'+
    '<button class="btn sm ghost" style="width:auto;padding:11px 18px" data-act="eye">'+(eye.on? eye.left+"s" : "开始")+'</button></div></section>';
  return html;
}

function viewBody(){
  var n = dayIndex();
  var html = "";
  var days = [], i;
  for(i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); days.push({k:dkey(d), d:d}); }
  html += '<section class="card"><p class="eyebrow">最近 7 天</p><h1 class="heroTitle" style="font-size:20px">完成度与身体信号</h1>';
  html += '<div class="rows">';
  for(i=0;i<days.length;i++){
    var rec = S.days[days[i].k] || {a:{}, m:{}};
    var c = doneCount(rec);
    var sw = (rec.m && rec.m.sweat) || 0;
    var an = (rec.m && rec.m.anx) || 0;
    html += '<div class="col"><div class="pair">'+
      '<i style="height:'+Math.max(2, c/7*56).toFixed(0)+'px"></i>'+
      '<i class="b" style="height:'+Math.max(2, sw/5*56).toFixed(0)+'px"></i>'+
      '</div><span class="d">'+["日","一","二","三","四","五","六"][days[i].d.getDay()]+'</span></div>';
  }
  html += '</div><div class="legend"><span>完成的时间点</span><span class="b">虚汗程度</span></div></section>';

  var rec0 = day();
  html += '<p class="sec">今天的感觉</p><section class="card tight"><div class="mood">';
  for(i=0;i<MOODS.length;i++){
    var m = MOODS[i], v = (rec0.m && rec0.m[m.id]) || 3;
    html += '<div class="lbl"><span>'+m.nm+'</span><span class="mv" id="mv-'+m.id+'">'+v+'</span></div>'+
      '<input type="range" min="1" max="5" step="1" value="'+v+'" data-act="mood" data-id="'+m.id+'">';
  }
  html += '</div></section>';

  var sum = 0, cnt = 0;
  for(i=0;i<7;i++){ var r = S.days[days[i].k]; if(r && r.m && r.m.sweat){ sum += r.m.sweat; cnt++; } }
  var avg = cnt? (sum/cnt).toFixed(1) : "—";
  html += '<section class="card tight"><div class="kv"><span>近 7 天虚汗均值</span><em>'+avg+' / 5</em></div>'+
    '<div class="kv"><span>连续完成天数</span><em>'+streak()+' 天</em></div>'+
    '<div class="kv"><span>今天是第</span><em>'+n+' 天</em></div></section>';
  html += '<p class="note" style="margin-top:4px">别追求每天都满分。一周里能守住 4 天，三个月就会明显不一样。虚汗均值往下走，比体重和步数更能说明问题。</p>';
  return html;
}

function viewPlan(){
  var n = dayIndex(), st = stageOf(n);
  var stages = [
    ["第一阶段 · 止血","第 1–2 周","只做三件事：充电器搬出卧室、固定 7:00 起床、午饭后走 10 分钟。别的全不管。"],
    ["第二阶段 · 补能","第 3–6 周","加运动、早餐蛋白、泡脚、八段锦。目标是把手机时长降 30%，不是清零。"],
    ["第三阶段 · 重建","第 7–12 周","加早晨 30 分钟学习、固定陪娃时段、每周一次 2 小时户外。"]
  ];
  var html = '<section class="card"><p class="eyebrow">90 天路线</p><h1 class="heroTitle" style="font-size:21px">你现在在第 '+n+' 天</h1>';
  for(var i=0;i<3;i++){
    var cls = (i+1===st)? "stage cur" : (i+1<st? "stage done":"stage");
    html += '<div class="'+cls+'"><div class="hd"><span class="nm">'+(i+1===st?"▸ ":"")+stages[i][0]+'</span><span class="wk">'+stages[i][1]+'</span></div>'+
      '<div class="ds">'+stages[i][2]+'</div></div>';
  }
  html += '</section>';

  html += '<p class="sec">三条铁律</p><section class="card tight">'+
    '<div class="q"><b>一</b>　不用意志力对抗算法，用环境。手机不在手边，比自律一百次都管用。</div>'+
    '<div class="q"><b>二</b>　一次只改一个变量。睡眠时间点是唯一值得先动的那个。</div>'+
    '<div class="q"><b>三</b>　累的时候不做计划，只做恢复。学习放早上，晚上只负责睡。</div></section>';

  html += '<p class="sec">把提醒交给手机系统的闹钟</p><section class="card tight">'+
    '<p class="note">网页的推送在手机后台经常收不到，别指望它。点下面导出日历，七个时间点会变成每天重复的闹钟，最靠得住。</p>'+
    '<div style="margin-top:12px"><button class="btn" data-act="ics">导出到手机日历（.ics）</button></div>'+
    '<p class="hint">iPhone：下载后点开 → 添加到日历。安卓：用日历 App 导入该文件。提醒声音记得在系统里打开。</p></section>';

  html += '<p class="sec">安装到桌面</p><section class="card tight">'+
    '<div class="step"><span class="n">1</span><span>用手机浏览器打开这个页面（Safari 或 Chrome，微信内置浏览器不行）。</span></div>'+
    '<div class="step"><span class="n">2</span><span>iPhone：点底部分享 → 添加到主屏幕。安卓：右上角菜单 → 添加到主屏幕。</span></div>'+
    '<div class="step"><span class="n">3</span><span>从桌面图标进入，就和新装了一个 APP 一样，断网也能用。</span></div></section>';

  html += '<p class="sec">数据</p><section class="card tight">'+
    '<div class="kv"><span>开始日期</span><em>'+S.start+'</em></div>'+
    '<div class="kv"><span>已记录天数</span><em>'+Object.keys(S.days).length+' 天</em></div>'+
    '<div style="margin-top:12px"><button class="btn sm ghost" data-act="export">复制全部数据（备份用）</button></div>'+
    '<div style="margin-top:8px"><button class="btn sm ghost" data-act="reset">清空重来</button></div>'+
    '<p class="hint">数据只存在这台手机里，不上传任何服务器。换手机前先复制备份。</p></section>';
  return html;
}

function render(){
  var v = tab==="today"? viewToday() : tab==="break"? viewBreak() : tab==="body"? viewBody() : viewPlan();
  document.getElementById("app").innerHTML = v;
  var tabs = [["today","今天","M3 12l9-8 9 8M6 10v10h12V10"],["break","断点","M12 3v9l6 3"],["body","身体","M12 21s-7-4.5-7-9a4 4 0 017-2.6A4 4 0 0119 12c0 4.5-7 9-7 9z"],["plan","节奏","M4 6h16M4 12h16M4 18h10"]];
  var th = "";
  for(var i=0;i<tabs.length;i++){
    th += '<button data-tab="'+tabs[i][0]+'" class="'+(tab===tabs[i][0]?"on":"")+'"><svg viewBox="0 0 24 24"><path d="'+tabs[i][2]+'"/></svg><span>'+tabs[i][1]+'</span></button>';
  }
  document.getElementById("tabs").innerHTML = th;
}

function stopBr(){ br.on=false; br.step=0; br.left=0; br.cycle=0; if(br.timer){ clearInterval(br.timer); br.timer=null; } }
function tickBr(){
  br.left--;
  if(br.left<=0){
    br.step++;
    if(br.step>2){ br.step=0; br.cycle++; }
    if(br.cycle>=br.total){ stopBr(); render(); return; }
    br.left = [4,7,8][br.step];
  }
  var root = document.querySelector(".breath");
  if(root){
    var C = 2*Math.PI*62, frac = br.left/[4,7,8][br.step];
    root.querySelector(".phase").textContent = ["吸气","屏息","呼气"][br.step];
    root.querySelector(".num").textContent = br.left;
    root.querySelector(".cyc").textContent = "第 "+Math.min(br.cycle+1,br.total)+" / "+br.total+" 轮";
    root.querySelector(".fg").setAttribute("stroke-dashoffset", (C-C*frac).toFixed(1));
  }
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab]");
  if(t){
    if(br.on) stopBr();
    if(eye.on && eye.timer){ clearInterval(eye.timer); eye.timer=null; eye.on=false; }
    tab = t.getAttribute("data-tab"); render(); window.scrollTo(0,0); return;
  }
  var b = e.target.closest("[data-act]");
  if(!b) return;
  var act = b.getAttribute("data-act"), rec = day();

  if(act==="toggle"){
    var id = b.getAttribute("data-id");
    rec.a[id] = !rec.a[id]; save();
    if(navigator.vibrate) navigator.vibrate(12);
    render(); return;
  }
  if(act==="urge"){
    rec.urge = (rec.urge||0)+1; save();
    b.textContent = "很好，你已经拖住第一步 · 往下走"; b.disabled = true;
    setTimeout(function(){ render(); }, 900); return;
  }
  if(act==="breath"){
    if(br.on){ stopBr(); render(); return; }
    br.on = true; br.step=0; br.left=4; br.cycle=0;
    br.timer = setInterval(tickBr, 1000);
    render(); return;
  }
  if(act==="alt"){ rec.urge = (rec.urge||0)+1; save(); render(); return; }
  if(act==="eye"){
    if(eye.on){ if(eye.timer) clearInterval(eye.timer); eye.timer=null; eye.on=false; render(); return; }
    eye.on = true; eye.left = 20;
    eye.timer = setInterval(function(){
      eye.left--;
      if(eye.left<=0){ clearInterval(eye.timer); eye.timer=null; eye.on=false; if(navigator.vibrate) navigator.vibrate([30,60,30]); render(); return; }
      var btn = document.querySelector('[data-act="eye"]');
      if(btn) btn.textContent = eye.left+"s";
    }, 1000);
    render(); return;
  }
  if(act==="ics"){ downloadIcs(); return; }
  if(act==="export"){
    var ta = document.createElement("textarea");
    ta.value = JSON.stringify(S);
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(err){}
    document.body.removeChild(ta);
    b.textContent = "已复制，粘到备忘录里存好";
    setTimeout(function(){ render(); }, 1600);
    return;
  }
  if(act==="reset"){
    if(confirm("清空全部记录，重新从第 1 天开始？此操作不可撤销。")){
      S = {start: dkey(new Date()), days:{}}; save(); render();
    }
    return;
  }
});

document.addEventListener("input", function(e){
  var el = e.target, act = el.getAttribute("data-act");
  if(!act) return;
  var rec = day();
  if(act==="sleep"){ rec.sleep = el.value; save(); return; }
  if(act==="steps"){ rec.steps = el.value; save(); return; }
  if(act==="mood"){
    rec.m[el.getAttribute("data-id")] = +el.value; save();
    var mv = document.getElementById("mv-"+el.getAttribute("data-id"));
    if(mv) mv.textContent = el.value;
    return;
  }
});

function icsLocal(d){
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
}
function downloadIcs(){
  var now = new Date(), base = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//jiezou//90days//CN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:节奏 · 一天的锚点"];
  for(var i=0;i<ANCHORS.length;i++){
    var a = ANCHORS[i], p = a.t.split(":"), st = new Date(base.getFullYear(), base.getMonth(), base.getDate(), +p[0], +p[1], 0);
    var en = new Date(st.getTime()+15*60000);
    L.push("BEGIN:VEVENT");
    L.push("UID:jiezou-"+a.id+"@local");
    L.push("DTSTAMP:"+icsLocal(now)+"Z");
    L.push("DTSTART:"+icsLocal(st));
    L.push("DTEND:"+icsLocal(en));
    L.push("RRULE:FREQ=DAILY");
    L.push("SUMMARY:"+a.ti);
    L.push("DESCRIPTION:"+a.sb);
    L.push("BEGIN:VALARM"); L.push("TRIGGER:-PT0M"); L.push("ACTION:DISPLAY"); L.push("DESCRIPTION:"+a.ti); L.push("END:VALARM");
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  var blob = new Blob([L.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement("a");
  a2.href = url; a2.download = "jiezou-anchors.ics";
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

load(); day(); save(); render();

if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
